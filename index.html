<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>互動式教室座位表 - 整合版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }
        .classroom-grid {
            background-color: #f8fafc;
            background-image: radial-gradient(#cbd5e1 1px, transparent 1px);
            background-size: 40px 40px;
            min-height: 850px;
            position: relative;
            overflow: hidden;
            border: 2px solid #e2e8f0;
            border-radius: 16px;
            box-shadow: inset 0 2px 4px 0 rgb(0 0 0 / 0.05);
            transition: transform 0.5s ease;
        }
        
        /* 老師視角的旋轉效果 */
        .classroom-grid.teacher-view {
            transform: rotate(180deg);
        }
        
        /* 老師視角時，確保卡片內容文字轉正 */
        .classroom-grid.teacher-view .student-card {
            transform: rotate(180deg);
        }

        .student-card {
            width: 110px;
            cursor: grab;
            position: absolute;
            transition: box-shadow 0.2s ease, transform 0.3s ease; /* 加入 transform 動畫 */
            user-select: none;
            touch-action: none;
            z-index: 10;
        }
        .student-card:active {
            z-index: 100;
            cursor: grabbing;
        }
        
        /* 鎖定模式下的卡片樣式 */
        .classroom-grid.locked .student-card {
            cursor: default;
        }
        
        .avatar-box {
            width: 85px;
            height: 85px;
            background-color: #ffffff;
            border: 3px solid #3b82f6;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            margin: 0 auto;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            transition: all 0.3s ease; /* 為了抽籤特效加入 transition */
        }
        .avatar-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            pointer-events: none;
        }
        .podium {
            width: 300px;
            height: 50px;
            background: linear-gradient(135deg, #4b5563 0%, #1f2937 100%);
            color: white;
            margin: 0 auto 30px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 0 0 20px 20px;
            font-weight: bold;
            letter-spacing: 0.1em;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            position: relative;
            z-index: 1;
        }
        
        /* 老師視角時，講台的外觀調整 */
        .classroom-grid.teacher-view .podium {
            border-radius: 20px 20px 0 0;
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
        }

        .score-btn {
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }
        .score-btn:active {
            transform: scale(0.9);
        }
        
        /* 自訂對話框樣式 */
        .dialog-overlay {
            background-color: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(4px);
            z-index: 9999;
        }
        .dialog-box {
            animation: dialogPop 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
        @keyframes dialogPop {
            0% { opacity: 0; transform: scale(0.95) translateY(10px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }
        
        /* 隱藏原生檔案上傳按鈕 */
        input[type="file"] {
            display: none;
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen p-4 md:p-6 text-slate-800">

    <div class="max-w-7xl mx-auto">
        <header class="mb-6 flex flex-col xl:flex-row justify-between items-start xl:items-end gap-6 bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
            <div>
                <div class="flex items-center gap-3 mb-2">
                    <span id="view-badge" class="bg-blue-100 text-blue-700 text-xs font-bold px-3 py-1 rounded-full uppercase tracking-wider flex items-center gap-1">
                        👀 學生視角 (主控)
                    </span>
                    <span id="lock-badge" class="hidden bg-slate-100 text-slate-600 text-xs font-bold px-3 py-1 rounded-full uppercase tracking-wider flex items-center gap-1">
                        🔒 座位已鎖定
                    </span>
                </div>
                <h1 class="text-3xl font-extrabold text-slate-800 tracking-tight">5B 座位與計分管理</h1>
                <p class="text-slate-500 mt-1 text-sm">拖動卡片排座位 / 點擊 + - 調整學生分數</p>
            </div>
            
            <div class="flex flex-col gap-3 w-full xl:w-auto">
                <!-- 第一排按鈕：視角與基本操作 -->
                <div class="flex flex-wrap gap-2">
                    <button onclick="toggleView()" id="view-btn" class="bg-indigo-50 hover:bg-indigo-100 text-indigo-700 border border-indigo-200 px-4 py-2 rounded-lg font-bold shadow-sm transition-all flex items-center gap-2">
                        🔄 切換為老師視角
                    </button>
                    <button onclick="resetScores()" class="bg-amber-50 hover:bg-amber-100 text-amber-700 border border-amber-200 px-4 py-2 rounded-lg font-bold shadow-sm transition-all flex items-center gap-2">
                        💯 分數歸零
                    </button>
                    <button onclick="resetLayout()" class="bg-rose-50 hover:bg-rose-100 text-rose-700 border border-rose-200 px-4 py-2 rounded-lg font-bold shadow-sm transition-all flex items-center gap-2">
                        🧹 重置座位
                    </button>
                    <button onclick="saveLayout()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-5 py-2 rounded-lg font-bold shadow-sm transition-all flex items-center gap-2 ml-auto xl:ml-0">
                        💾 儲存佈局
                    </button>
                </div>
                
                <!-- 第二排按鈕：進階功能 -->
                <div class="flex flex-wrap gap-2 border-t border-slate-100 pt-3">
                    <button id="lock-btn" onclick="toggleLock()" class="bg-slate-600 hover:bg-slate-700 text-white px-4 py-2 rounded-lg font-medium shadow-sm transition-all flex items-center gap-2">
                        🔓 鎖定座位
                    </button>
                    <!-- 新增隨機抽籤按鈕 -->
                    <button onclick="randomSelect()" class="bg-purple-500 hover:bg-purple-600 text-white px-4 py-2 rounded-lg font-medium shadow-sm transition-all flex items-center gap-2">
                        🎲 隨機抽籤
                    </button>
                    <button onclick="exportData()" class="bg-sky-500 hover:bg-sky-600 text-white px-4 py-2 rounded-lg font-medium shadow-sm transition-all flex items-center gap-2">
                        ⬇️ 匯出備份
                    </button>
                    <label for="import-file" class="bg-teal-500 hover:bg-teal-600 text-white px-4 py-2 rounded-lg font-medium shadow-sm transition-all flex items-center gap-2 cursor-pointer">
                        ⬆️ 匯入備份
                    </label>
                    <input type="file" id="import-file" accept=".json" onchange="importData(event)">
                </div>
            </div>
        </header>

        <div class="bg-white p-4 md:p-6 rounded-2xl shadow-xl border border-slate-200 relative">
            <div id="classroom" class="classroom-grid">
                <div class="podium absolute top-0 left-1/2 -translate-x-1/2">講台 / 黑板方向</div>
                <!-- 學生卡片將由 JavaScript 生成在這裡 -->
            </div>
        </div>

        <footer class="mt-8 text-center text-slate-400 text-sm">
            提示：照片檔案名稱請設定為如 `5b01.jpg`、`5b02.jpg`，並與網頁檔案放在同一資料夾內。
        </footer>
    </div>

    <!-- 自訂對話框容器 (隱藏) -->
    <div id="custom-dialog" class="fixed inset-0 dialog-overlay hidden flex items-center justify-center">
        <div class="dialog-box bg-white rounded-2xl shadow-2xl p-6 max-w-sm w-full mx-4 border border-slate-100">
            <h3 id="dialog-title" class="text-xl font-bold text-slate-800 mb-2">提示</h3>
            <p id="dialog-message" class="text-slate-600 mb-4 text-sm"></p>
            
            <div id="dialog-input-container" class="hidden mb-4">
                <input type="password" id="dialog-input" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500" placeholder="請輸入密碼">
            </div>

            <div class="flex justify-end gap-3 mt-6">
                <button id="dialog-cancel" class="px-4 py-2 rounded-lg font-medium text-slate-600 hover:bg-slate-100 transition-colors">取消</button>
                <button id="dialog-confirm" class="px-4 py-2 rounded-lg font-medium text-white bg-indigo-600 hover:bg-indigo-700 transition-colors">確定</button>
            </div>
        </div>
    </div>

    <!-- 吐司提示容器 (隱藏) -->
    <div id="toast-container" class="fixed bottom-8 left-1/2 -translate-x-1/2 z-[1000] flex flex-col gap-2 pointer-events-none"></div>

    <script>
        // 學生資料設定
        const students = [
            { id: "01", name: "Gordon C" }, { id: "02", name: "Clarus" }, { id: "03", name: "Noleen" },
            { id: "04", name: "Jamie" }, { id: "05", name: "Vivian" }, { id: "06", name: "Torrise" },
            { id: "07", name: "Yanice" }, { id: "08", name: "Charlie" }, { id: "09", name: "Joel" },
            { id: "10", name: "Giuseppe" }, { id: "11", name: "Alpha" }, { id: "12", name: "Aayan" },
            { id: "13", name: "Alson" }, { id: "14", name: "Anisha" }, { id: "16", name: "Farida" },
            { id: "18", name: "Arianne" }, { id: "19", name: "Kate" }, { id: "20", name: "Nihnam" },
            { id: "21", name: "Wahenoor" }, { id: "22", name: "Viraj" }, { id: "23", name: "Gordon T" },
            { id: "24", name: "Jasnoor" }
        ];

        // 狀態管理
        const classroom = document.getElementById('classroom');
        let studentScores = JSON.parse(localStorage.getItem('studentScores_5B_V2')) || {};
        let savedPositions = JSON.parse(localStorage.getItem('seatingPositions_5B_V2')) || {};
        let isTeacherView = false;
        let isLocked = false;

        // 拖曳相關變數
        let activeCard = null, offset = { x: 0, y: 0 };

        function initStudents() {
            classroom.innerHTML = '<div class="podium absolute top-0 left-1/2 -translate-x-1/2 transition-all duration-500">講台 / 黑板方向</div>';
            
            // 如果視角切換時位置為空，則使用預設排列
            if (Object.keys(savedPositions).length === 0) {
                 setupDefaultPositions();
            }

            students.forEach((student) => {
                const card = document.createElement('div');
                card.className = 'student-card text-center';
                card.id = `student-${student.id}`;
                
                // 應用位置
                const pos = savedPositions[student.id];
                if(pos) {
                    card.style.left = pos.x + 'px';
                    card.style.top = pos.y + 'px';
                }

                // 照片路徑設定 (根據需求設定為 5b01.jpg)
                const fileName = `5b${student.id}.jpg`;
                const currentScore = studentScores[student.id] || 0;

                // 卡片 HTML 結構
                card.innerHTML = `
                    <div class="avatar-box">
                        <img src="${fileName}" alt="${student.name}" onerror="this.src='https://ui-avatars.com/api/?name=${student.name}&background=eff6ff&color=1d4ed8&size=128&bold=true'">
                    </div>
                    <div class="mt-2 inline-block bg-white/95 backdrop-blur rounded-lg border border-slate-200 shadow-sm p-1.5 min-w-[90px] transition-transform duration-300">
                        <div class="text-[10px] uppercase text-slate-400 font-bold tracking-wider leading-none mb-0.5">NO.${student.id}</div>
                        <div class="text-xs font-bold text-slate-800 whitespace-nowrap mb-1">${student.name}</div>
                        <div class="flex items-center justify-between border-t border-slate-100 pt-1 mt-1">
                            <button class="score-btn text-red-500 hover:bg-red-50 rounded px-2 py-0.5 text-sm font-bold" onclick="updateScore('${student.id}', -1, event)">-</button>
                            <span class="text-sm font-extrabold text-indigo-600 w-6 text-center" id="score-${student.id}">${currentScore}</span>
                            <button class="score-btn text-green-500 hover:bg-green-50 rounded px-2 py-0.5 text-sm font-bold" onclick="updateScore('${student.id}', 1, event)">+</button>
                        </div>
                    </div>
                `;

                // 註冊事件監聽
                card.addEventListener('mousedown', startDragging);
                card.addEventListener('touchstart', (e) => {
                    if(e.target.closest('.score-btn')) return; // 點擊按鈕時不觸發拖曳
                    const touch = e.touches[0];
                    const mouseEvent = new MouseEvent("mousedown", { clientX: touch.clientX, clientY: touch.clientY });
                    card.dispatchEvent(mouseEvent);
                }, { passive: false });
                
                classroom.appendChild(card);
            });
            
            updateLockUI();
        }

        function setupDefaultPositions() {
            students.forEach((student, index) => {
                const colCount = 6; // 一排6人
                const defaultX = (index % colCount) * 140 + 60;
                const defaultY = Math.floor(index / colCount) * 160 + 80; // 往下移避開講台
                savedPositions[student.id] = { x: defaultX, y: defaultY };
            });
        }

        window.updateScore = function(id, delta, event) {
            event.stopPropagation(); // 阻止事件冒泡觸發拖曳
            studentScores[id] = (studentScores[id] || 0) + delta;
            document.getElementById(`score-${id}`).innerText = studentScores[id];
            localStorage.setItem('studentScores_5B_V2', JSON.stringify(studentScores));
        };

        function startDragging(e) {
            if(isLocked) {
                showToast("座位已鎖定，無法拖曳。");
                return;
            }
            if(e.target.closest('.score-btn')) return;
            
            activeCard = e.currentTarget;
            const rect = activeCard.getBoundingClientRect();
            const parentRect = classroom.getBoundingClientRect();
            
            // 計算點擊位置與卡片左上角的偏移量
            offset.x = e.clientX - rect.left;
            offset.y = e.clientY - rect.top;
            
            document.addEventListener('mousemove', drag);
            document.addEventListener('mouseup', stopDragging);
            document.addEventListener('touchmove', handleTouchMove, { passive: false });
            document.addEventListener('touchend', stopDragging);
        }

        function handleTouchMove(e) {
            if (!activeCard) return;
            e.preventDefault(); // 防止滾動
            const touch = e.touches[0];
            const mouseEvent = new MouseEvent("mousemove", { clientX: touch.clientX, clientY: touch.clientY });
            document.dispatchEvent(mouseEvent);
        }

        function drag(e) {
            if (!activeCard) return;
            const parentRect = classroom.getBoundingClientRect();
            
            let x, y;
            
            if(isTeacherView) {
                // 在老師視角(旋轉180度)下，拖曳的方向和座標計算需要反轉
                x = parentRect.right - e.clientX - offset.x;
                y = parentRect.bottom - e.clientY - offset.y;
            } else {
                x = e.clientX - parentRect.left - offset.x;
                y = e.clientY - parentRect.top - offset.y;
            }

            // 邊界限制
            x = Math.max(5, Math.min(x, parentRect.width - activeCard.offsetWidth - 5));
            y = Math.max(5, Math.min(y, parentRect.height - activeCard.offsetHeight - 5));
            
            activeCard.style.left = x + 'px';
            activeCard.style.top = y + 'px';
            
            // 即時更新內部座標紀錄 (但不存入 localStorage，等按下儲存才存)
            const id = activeCard.id.split('-')[1];
            savedPositions[id] = { x: parseInt(x), y: parseInt(y) };
        }

        function stopDragging() { 
            activeCard = null; 
            document.removeEventListener('mousemove', drag); 
            document.removeEventListener('mouseup', stopDragging);
            document.removeEventListener('touchmove', handleTouchMove);
            document.removeEventListener('touchend', stopDragging);
        }

        function showDialog(options, callback) {
            const dialog = document.getElementById('custom-dialog');
            const titleEl = document.getElementById('dialog-title');
            const msgEl = document.getElementById('dialog-message');
            const inputContainer = document.getElementById('dialog-input-container');
            const inputEl = document.getElementById('dialog-input');
            const cancelBtn = document.getElementById('dialog-cancel');
            const confirmBtn = document.getElementById('dialog-confirm');

            titleEl.innerText = options.title || '提示';
            msgEl.innerText = options.message || '';
            
            if(options.isDanger) {
                confirmBtn.className = "px-4 py-2 rounded-lg font-medium text-white bg-rose-600 hover:bg-rose-700 transition-colors";
            } else {
                confirmBtn.className = "px-4 py-2 rounded-lg font-medium text-white bg-indigo-600 hover:bg-indigo-700 transition-colors";
            }

            if(options.showInput) {
                inputContainer.classList.remove('hidden');
                inputEl.value = '';
                // 聚焦輸入框
                setTimeout(() => inputEl.focus(), 100);
            } else {
                inputContainer.classList.add('hidden');
            }

            dialog.classList.remove('hidden');

            const handleConfirm = () => {
                cleanup();
                if(options.showInput) {
                    callback(inputEl.value);
                } else {
                    callback(true);
                }
            };

            const handleCancel = () => {
                cleanup();
                callback(null);
            };

            const cleanup = () => {
                dialog.classList.add('hidden');
                confirmBtn.removeEventListener('click', handleConfirm);
                cancelBtn.removeEventListener('click', handleCancel);
            };

            confirmBtn.addEventListener('click', handleConfirm);
            cancelBtn.addEventListener('click', handleCancel);
        }

        function showToast(text) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = "bg-slate-800 text-white px-6 py-3 rounded-full shadow-2xl transition-all duration-300 opacity-0 translate-y-4 font-medium text-sm";
            toast.innerText = text;
            
            container.appendChild(toast);
            
            // 動畫顯示
            requestAnimationFrame(() => {
                toast.classList.remove('opacity-0', 'translate-y-4');
            });
            
            // 3秒後移除
            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-4');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        window.saveLayout = function() {
            localStorage.setItem('seatingPositions_5B_V2', JSON.stringify(savedPositions));
            showToast("佈局已成功儲存！");
        };

        window.randomSelect = function() {
            if (students.length === 0) {
                showToast("目前沒有學生資料！");
                return;
            }
            
            // 隨機抽選一位學生
            const randomIndex = Math.floor(Math.random() * students.length);
            const selectedStudent = students[randomIndex];
            const cardElement = document.getElementById(`student-${selectedStudent.id}`);
            
            if (cardElement) {
                const avatarBox = cardElement.querySelector('.avatar-box');
                
                // 重置之前的特效，避免連點問題
                avatarBox.classList.remove('ring-4', 'ring-purple-500', 'ring-offset-4', 'scale-125', 'animate-pulse', 'z-[2000]');
                void avatarBox.offsetWidth; // 強制重繪
                
                // 加入放大、紫圈發光與閃爍特效
                cardElement.style.zIndex = "2000"; 
                avatarBox.classList.add('transition-all', 'duration-300', 'ring-4', 'ring-purple-500', 'ring-offset-4', 'scale-125', 'animate-pulse');
                
                // 顯示廣播文字
                showToast(`🎲 抽中：NO.${selectedStudent.id} ${selectedStudent.name}！`);
                
                // 3秒後移除特效
                setTimeout(() => {
                    avatarBox.classList.remove('ring-4', 'ring-purple-500', 'ring-offset-4', 'scale-125', 'animate-pulse');
                    cardElement.style.zIndex = "10";
                }, 3000);
            }
        };

        window.resetScores = function() {
            showDialog({
                title: '分數歸零', 
                message: '確定要將全班的分數歸零嗎？此動作無法復原。請輸入密碼以繼續：', 
                showInput: true,
                isDanger: true
            }, (input) => {
                if (input === null) return; // 取消
                if (input === '666') {
                    studentScores = {};
                    localStorage.removeItem('studentScores_5B_V2');
                    initStudents(); // 重新渲染畫面更新分數
                    showToast("✅ 全班分數已歸零！");
                } else {
                    showToast("❌ 密碼錯誤，操作已取消！");
                }
            });
        };

        window.resetLayout = function() {
            showDialog({
                title: '重置座位', 
                message: '確定要將所有學生的座位恢復到預設排列嗎？未儲存的變更將遺失。請輸入密碼以繼續：', 
                showInput: true,
                isDanger: true
            }, (input) => {
                if (input === null) return; // 取消
                if (input === '666') {
                    savedPositions = {};
                    localStorage.removeItem('seatingPositions_5B_V2');
                    setupDefaultPositions();
                    initStudents(); // 重新渲染
                    showToast("🧹 座位已重置為預設排列。");
                } else {
                    showToast("❌ 密碼錯誤，操作已取消！");
                }
            });
        };

        window.toggleView = function() {
            isTeacherView = !isTeacherView;
            
            const btn = document.getElementById('view-btn');
            const badge = document.getElementById('view-badge');
            
            if (isTeacherView) {
                classroom.classList.add('teacher-view');
                btn.innerHTML = '🔄 切換為學生視角';
                btn.className = "bg-emerald-50 hover:bg-emerald-100 text-emerald-700 border border-emerald-200 px-4 py-2 rounded-lg font-bold shadow-sm transition-all flex items-center gap-2";
                
                badge.className = "bg-emerald-100 text-emerald-700 text-xs font-bold px-3 py-1 rounded-full uppercase tracking-wider flex items-center gap-1";
                badge.innerHTML = '👨‍🏫 老師視角 (已翻轉)';
                showToast("切換至老師視角：畫面已旋轉 180 度。");
            } else {
                classroom.classList.remove('teacher-view');
                btn.innerHTML = '🔄 切換為老師視角';
                btn.className = "bg-indigo-50 hover:bg-indigo-100 text-indigo-700 border border-indigo-200 px-4 py-2 rounded-lg font-bold shadow-sm transition-all flex items-center gap-2";
                
                badge.className = "bg-blue-100 text-blue-700 text-xs font-bold px-3 py-1 rounded-full uppercase tracking-wider flex items-center gap-1";
                badge.innerHTML = '👀 學生視角 (主控)';
                showToast("切換回學生視角。");
            }
        };

        window.toggleLock = function() {
            const actionText = isLocked ? "解除鎖定" : "鎖定";
            showDialog({
                title: `${actionText}座位`, 
                message: `請輸入密碼以${actionText}座位：`, 
                showInput: true,
                isDanger: false
            }, (input) => {
                if (input === null) return; // 取消
                if (input === '666') {
                    isLocked = !isLocked;
                    updateLockUI();
                    
                    if(isLocked) {
                        showToast("🔒 座位已鎖定，無法拖曳。");
                    } else {
                        showToast("🔓 座位已解鎖，可以拖曳。");
                    }
                } else {
                    showToast("❌ 密碼錯誤，操作已取消！");
                }
            });
        };

        function updateLockUI() {
            const btn = document.getElementById('lock-btn');
            const badge = document.getElementById('lock-badge');
            
            if (isLocked) {
                classroom.classList.add('locked');
                btn.innerHTML = '🔓 解除鎖定';
                btn.className = "bg-slate-200 hover:bg-slate-300 text-slate-700 px-4 py-2 rounded-lg font-medium shadow-sm transition-all flex items-center gap-2";
                badge.classList.remove('hidden');
            } else {
                classroom.classList.remove('locked');
                btn.innerHTML = '🔒 鎖定座位';
                btn.className = "bg-slate-600 hover:bg-slate-700 text-white px-4 py-2 rounded-lg font-medium shadow-sm transition-all flex items-center gap-2";
                badge.classList.add('hidden');
            }
        }

        window.exportData = function() {
            const dataToExport = {
                positions: savedPositions,
                scores: studentScores,
                exportDate: new Date().toISOString()
            };
            
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(dataToExport, null, 2));
            const downloadAnchorNode = document.createElement('a');
            downloadAnchorNode.setAttribute("href", dataStr);
            const dateStr = new Date().toISOString().split('T')[0];
            downloadAnchorNode.setAttribute("download", `5B_座位與分數備份_${dateStr}.json`);
            document.body.appendChild(downloadAnchorNode); // Firefox requires this
            downloadAnchorNode.click();
            downloadAnchorNode.remove();
            
            showToast("檔案下載中，請妥善保存備份。");
        };

        window.importData = function(event) {
            const file = event.target.files[0];
            if (!file) return;

            showDialog({
                title: '匯入資料', 
                message: '匯入將會覆蓋目前的座位與分數，確定要繼續嗎？', 
                showInput: false,
                isDanger: true
            }, (confirm) => {
                if(confirm) {
                    const reader = new FileReader();
                    reader.onload = function(e) {
                        try {
                            const importedData = JSON.parse(e.target.result);
                            
                            // 基本的格式驗證
                            if(importedData.positions && importedData.scores) {
                                savedPositions = importedData.positions;
                                studentScores = importedData.scores;
                                
                                // 存入本地儲存
                                localStorage.setItem('seatingPositions_5B_V2', JSON.stringify(savedPositions));
                                localStorage.setItem('studentScores_5B_V2', JSON.stringify(studentScores));
                                
                                initStudents();
                                showToast("✅ 資料匯入成功！");
                            } else {
                                throw new Error("檔案格式不符");
                            }
                        } catch (error) {
                            showToast("❌ 匯入失敗：檔案格式錯誤或已損毀。");
                            console.error("Import error:", error);
                        }
                    };
                    reader.readAsText(file);
                }
                // 重置 input，允許重複選擇同一個檔案
                event.target.value = '';
            });
        };

        // 網頁載入完成後執行
        window.onload = initStudents;
    </script>
</body>
</html>
