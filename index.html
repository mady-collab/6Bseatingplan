<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>互動式教室座位表 - 學生視角 (含計分)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .classroom-grid {
            background-color: #f8fafc;
            background-image: radial-gradient(#cbd5e1 1px, transparent 1px);
            background-size: 40px 40px;
            min-height: 850px;
            position: relative;
            overflow: hidden;
            border: 2px solid #cbd5e1;
            border-radius: 12px;
        }
        .student-card {
            width: 110px;
            cursor: move;
            position: absolute;
            transition: transform 0.1s ease, box-shadow 0.2s ease;
            user-select: none;
            touch-action: none; /* 防止手機滑動干擾 */
            z-index: 10;
        }
        .student-card:active {
            z-index: 100;
            cursor: grabbing;
        }
        .avatar-box {
            width: 85px;
            height: 85px;
            background-color: #ffffff;
            border: 3px solid #3b82f6; /* 學生視角藍色邊框 */
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            margin: 0 auto;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
        }
        .avatar-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            pointer-events: none; /* 避免拖曳時選到圖片 */
        }
        .podium {
            width: 300px;
            height: 50px;
            background: linear-gradient(135deg, #4b5563 0%, #1f2937 100%);
            color: white;
            margin: 0 auto 30px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 0 0 20px 20px;
            font-weight: bold;
            letter-spacing: 0.1em;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .score-btn {
            cursor: pointer;
            transition: background-color 0.2s;
        }
    </style>
</head>
<body class="bg-slate-50 p-6">

    <div class="max-w-7xl mx-auto">
        <header class="mb-6 flex flex-col md:flex-row justify-between items-start md:items-end gap-4">
            <div>
                <span class="bg-blue-100 text-blue-600 text-xs font-bold px-2 py-1 rounded-full uppercase tracking-wider">Main View / Editable</span>
                <h1 class="text-3xl font-extrabold text-slate-800 tracking-tight mt-1">5B 座位與計分管理</h1>
                <p class="text-slate-500 mt-1">拖動卡片排座位 / 點擊 + - 調整學生分數</p>
            </div>
            <div class="flex flex-wrap gap-2">
                <button onclick="saveLayout()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg font-medium shadow-sm transition-all flex items-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg>
                    儲存佈局
                </button>
                <button onclick="resetScores()" class="bg-amber-500 hover:bg-amber-600 text-white px-4 py-2 rounded-lg font-medium shadow-sm transition-all">
                    分數歸零
                </button>
                <button onclick="resetLayout()" class="bg-white border border-slate-300 hover:bg-slate-50 text-slate-600 px-4 py-2 rounded-lg font-medium shadow-sm transition-all">
                    重置座位
                </button>
            </div>
        </header>

        <!-- 教室主體 -->
        <div class="bg-white p-4 rounded-xl shadow-lg border border-slate-200">
            <div class="podium">講台 / 黑板方向</div>
            <div id="classroom" class="classroom-grid">
                <!-- 學生卡片將由 JavaScript 生成 -->
            </div>
        </div>

        <footer class="mt-6 text-center text-slate-400 text-sm">
            提示：照片檔案請命名為如 「5b01.jpg」 並放置於同一目錄
        </footer>
    </div>

    <script>
        const students = [
            { id: "01", name: "Gordon C" }, { id: "02", name: "Clarus" }, { id: "03", name: "Noleen" },
            { id: "04", name: "Jamie" }, { id: "05", name: "Vivian" }, { id: "06", name: "Torrise" },
            { id: "07", name: "Yanice" }, { id: "08", name: "Charlie" }, { id: "09", name: "Joel" },
            { id: "10", name: "Giuseppe" }, { id: "11", name: "Alpha" }, { id: "12", name: "Aayan" },
            { id: "13", name: "Alson" }, { id: "14", name: "Anisha" }, { id: "16", name: "Farida" },
            { id: "18", name: "Arianne" }, { id: "19", name: "Kate" }, { id: "20", name: "Nihnam" },
            { id: "21", name: "Wahenoor" }, { id: "22", name: "Viraj" }, { id: "23", name: "Gordon T" },
            { id: "24", name: "Jasnoor" }
        ];

        const classroom = document.getElementById('classroom');
        let activeCard = null;
        let offset = { x: 0, y: 0 };
        
        // 取得儲存的分數紀錄
        let studentScores = JSON.parse(localStorage.getItem('studentScores_5B_V2')) || {};

        function initStudents() {
            const savedPositions = JSON.parse(localStorage.getItem('seatingPositions_5B_V2')) || {};
            classroom.innerHTML = ''; // 清空容器
            
            students.forEach((student, index) => {
                const card = document.createElement('div');
                card.className = 'student-card text-center';
                card.id = `student-${student.id}`;
                
                // 預設網格排佈
                const colCount = 6;
                const defaultX = (index % colCount) * 140 + 60;
                const defaultY = Math.floor(index / colCount) * 160 + 50;
                
                const pos = savedPositions[student.id] || { x: defaultX, y: defaultY };
                card.style.left = pos.x + 'px';
                card.style.top = pos.y + 'px';

                const fileName = `5b${student.id}.jpg`;
                const currentScore = studentScores[student.id] || 0;

                card.innerHTML = `
                    <div class="avatar-box">
                        <img src="${fileName}" alt="${student.name}" onerror="this.src='https://ui-avatars.com/api/?name=${student.name}&background=eff6ff&color=1d4ed8&size=128&bold=true'">
                    </div>
                    <div class="mt-2 inline-block bg-white/95 backdrop-blur rounded-lg border border-slate-200 shadow-sm p-1.5 min-w-[90px]">
                        <div class="text-[10px] uppercase text-slate-400 font-bold tracking-wider leading-none mb-0.5">NO.${student.id}</div>
                        <div class="text-xs font-bold text-slate-800 whitespace-nowrap mb-1">
                            ${student.name}
                        </div>
                        <!-- 計分區塊 -->
                        <div class="flex items-center justify-between border-t border-slate-100 pt-1 mt-1">
                            <button class="score-btn text-red-500 hover:bg-red-50 rounded px-2 py-0.5 text-sm font-bold" 
                                    onmousedown="updateScore('${student.id}', -1, event)" 
                                    ontouchstart="updateScore('${student.id}', -1, event)">-</button>
                            <span class="text-sm font-extrabold text-indigo-600 w-6 text-center" id="score-${student.id}">
                                ${currentScore}
                            </span>
                            <button class="score-btn text-green-500 hover:bg-green-50 rounded px-2 py-0.5 text-sm font-bold" 
                                    onmousedown="updateScore('${student.id}', 1, event)" 
                                    ontouchstart="updateScore('${student.id}', 1, event)">+</button>
                        </div>
                    </div>
                `;

                // 綁定拖曳事件 (僅限卡片本身，按鈕透過 event.stopPropagation 防止觸發)
                card.addEventListener('mousedown', startDragging);
                card.addEventListener('touchstart', (e) => {
                    // 如果點擊的是按鈕，不要觸發卡片拖曳
                    if(e.target.closest('.score-btn')) return;
                    const touch = e.touches[0];
                    const mouseEvent = new MouseEvent("mousedown", {
                        clientX: touch.clientX,
                        clientY: touch.clientY
                    });
                    card.dispatchEvent(mouseEvent);
                }, { passive: false });

                classroom.appendChild(card);
            });
        }

        // 分數更新邏輯
        window.updateScore = function(id, delta, event) {
            // 防止觸發卡片的拖曳事件
            if(event) {
                event.preventDefault();
                event.stopPropagation();
            }
            
            studentScores[id] = (studentScores[id] || 0) + delta;
            document.getElementById(`score-${id}`).innerText = studentScores[id];
            
            // 即時儲存分數
            localStorage.setItem('studentScores_5B_V2', JSON.stringify(studentScores));
        };

        // 拖曳相關邏輯
        function startDragging(e) {
            // 如果點擊目標是按鈕，不啟動拖曳
            if(e.target.closest('.score-btn')) return;

            activeCard = e.currentTarget;
            activeCard.style.transform = "scale(1.05)";
            const rect = activeCard.getBoundingClientRect();
            const parentRect = classroom.getBoundingClientRect();
            
            offset.x = e.clientX - rect.left;
            offset.y = e.clientY - rect.top;

            document.addEventListener('mousemove', drag);
            document.addEventListener('mouseup', stopDragging);
            document.addEventListener('touchmove', handleTouchMove, { passive: false });
            document.addEventListener('touchend', stopDragging);
        }

        function handleTouchMove(e) {
            if (!activeCard) return;
            e.preventDefault(); // 防止滾動頁面
            const touch = e.touches[0];
            const mouseEvent = new MouseEvent("mousemove", {
                clientX: touch.clientX,
                clientY: touch.clientY
            });
            document.dispatchEvent(mouseEvent);
        }

        function drag(e) {
            if (!activeCard) return;
            
            const parentRect = classroom.getBoundingClientRect();
            let x = e.clientX - parentRect.left - offset.x;
            let y = e.clientY - parentRect.top - offset.y;

            // 限制在教室區域內
            x = Math.max(5, Math.min(x, parentRect.width - activeCard.offsetWidth - 5));
            y = Math.max(5, Math.min(y, parentRect.height - activeCard.offsetHeight - 5));

            activeCard.style.left = x + 'px';
            activeCard.style.top = y + 'px';
        }

        function stopDragging() {
            if (activeCard) {
                activeCard.style.transform = "scale(1)";
            }
            activeCard = null;
            document.removeEventListener('mousemove', drag);
            document.removeEventListener('mouseup', stopDragging);
            document.removeEventListener('touchmove', handleTouchMove);
            document.removeEventListener('touchend', stopDragging);
        }

        function saveLayout() {
            const positions = {};
            students.forEach(s => {
                const el = document.getElementById(`student-${s.id}`);
                positions[s.id] = {
                    x: parseInt(el.style.left),
                    y: parseInt(el.style.top)
                };
            });
            localStorage.setItem('seatingPositions_5B_V2', JSON.stringify(positions));
            showToast("座位佈局已儲存成功！");
        }

        function resetLayout() {
            if(confirm("確定要重置所有座位到初始網格位置嗎？（分數不會被清空）")) {
                localStorage.removeItem('seatingPositions_5B_V2');
                initStudents();
            }
        }

        function resetScores() {
            if(confirm("確定要將全班的分數歸零嗎？（座位不會改變）")) {
                studentScores = {};
                localStorage.removeItem('studentScores_5B_V2');
                
                // 更新畫面上所有的分數顯示
                students.forEach(s => {
                    const scoreEl = document.getElementById(`score-${s.id}`);
                    if(scoreEl) scoreEl.innerText = "0";
                });
                showToast("全班分數已歸零");
            }
        }

        function showToast(text) {
            const toast = document.createElement('div');
            toast.className = "fixed bottom-8 left-1/2 -translate-x-1/2 bg-slate-800 text-white px-6 py-3 rounded-full shadow-2xl z-[1000] flex items-center gap-2 transform transition-all duration-300 translate-y-20 opacity-0";
            toast.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#4ade80" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg> ${text}`;
            document.body.appendChild(toast);
            
            setTimeout(() => toast.classList.remove('translate-y-20', 'opacity-0'), 50);
            setTimeout(() => {
                toast.classList.add('translate-y-20', 'opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 2500);
        }

        window.onload = initStudents;
    </script>
</body>
</html>
